# subaco-shim CI（just 規約 test / lint / fmt に対応）
#
# 方針:
# - lint（ruff check + format --check）と test（pytest / mock ドライバ）を
#   ubuntu + macos マトリクスで実行する。実行時依存は certifi のみ（uv run が解決）。
# - podman の実コンテナ統合は **nightly**（schedule）で ubuntu のみ実行する。実バイナリ検出に
#   依存するテストは `shutil.which("podman")` ガードで skip されるため、通常の PR/push では走らない。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎日 04:00 UTC。podman 実コンテナ統合の nightly ジョブを回す。
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: uv をセットアップ（Python 3.11）
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: ruff check
        run: uv run --with ruff ruff check .
      - name: ruff format --check（非破壊の整形チェック）
        run: uv run --with ruff ruff format --check .

  test:
    name: test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: uv をセットアップ（Python 3.11）
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: pytest（mock ドライバ。実行時依存 certifi は uv run が解決）
        run: uv run --with pytest pytest -q

  wire-contract:
    name: wire contract (${{ matrix.os }})
    # 実 E2B SDK（固定バージョン pin——pyproject の test extra）をクライアントに使う
    # ワイヤ契約 E2E（05_spike結果_E2B_ワイヤ.md §6-7）。*.sbx.localhost の名前解決に
    # 依存するため、-rs で skip 理由を可視化する（ubuntu の解決可否は M2a の残実測項目）。
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: uv をセットアップ（Python 3.11）
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: 依存を同期（e2b SDK 固定版を含む test extra）
        run: uv sync --extra test
      - name: pytest（ワイヤ契約 E2E）
        run: uv run pytest tests/test_wire_contract.py -q -rs

  podman-integration:
    name: podman integration (nightly)
    # nightly（schedule）と手動実行でのみ走らせる。PR/push では skip。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: podman を確保（ランナー同梱を優先・不在時のみ apt）
        # ランナー同梱の podman（/usr/local/bin・5.x）があれば apt を打たない:
        # apt の 4.9 系を併存させると「pull した個体と別バージョンが同一ストレージを
        # 操作して podman run が futex 待ちハング」する（実測で確定した障害）。
        # ドライバ側も PATH 優先検出に修正済みだが、混在自体を作らないのが第一。
        run: |
          if command -v podman; then
            podman --version
            exit 0
          fi
          # 不在時のみ apt（azure ミラー不調対策: 標準ミラー切替 + リトライ/タイムアウト）。
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' \
            /etc/apt/sources.list.d/ubuntu.sources
          apt_get() {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 "$@"
          }
          for _ in 1 2 3; do
            if apt_get update; then break; fi
            sleep 5
          done
          apt_get install -y podman
          podman --version
      - name: uv をセットアップ（Python 3.11）
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: サンドボックスイメージを事前 pull（create 時 120s タイムアウトから pull を分離）
        env:
          LIVE_TEMPLATE: docker.io/library/python:3.12-slim
        run: podman pull "$LIVE_TEMPLATE"
      - name: 依存を同期（実 SDK 固定版を含む test extra——全スタック E2E 用）
        run: uv sync --extra test
      - name: pytest（実コンテナ統合——M2a-5 実測＝egress 遮断・サンドボックス間分離・切断キャンセル）
        # SUBACO_SHIM_LIVE_TEMPLATE を渡すと実ドライバ契約（test_driver_contract）と
        # 実測スイート（test_live_podman_isolation）が有効化される。イメージ要件は
        # python3 / sh / GNU sleep（sleep infinity）。busybox の sleep は infinity 非対応の
        # ため alpine 系は不可。TODO: subaco の共通サンドボックスイメージ
        # （ghcr.io/subaco-dev/subaco-sandbox）が public になったら digest 固定参照へ切替。
        env:
          SUBACO_SHIM_LIVE_TEMPLATE: docker.io/library/python:3.12-slim
        run: uv run pytest -q -rs
      - name: pytest（実 SDK × 実 podman の全スタック E2E——M2a DoD。専用プロセスで実行）
        # test_live_podman_wire は SDK（httpx）の SSL context キャッシュ対策として
        # SUBACO_SHIM_LIVE_WIRE=1 の独立プロセスでのみ走る（test_wire_contract の
        # mock シムと同一プロセスに同居させない——README のテスト技法参照）。
        env:
          SUBACO_SHIM_LIVE_TEMPLATE: docker.io/library/python:3.12-slim
          SUBACO_SHIM_LIVE_WIRE: "1"
        run: uv run pytest tests/test_live_podman_wire.py -q -rs
