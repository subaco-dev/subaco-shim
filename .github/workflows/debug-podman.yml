name: debug-podman
# 一時的な診断ワークフロー（M2a-5 実測で `podman run -d --network <internal>` が
# ubuntu ランナーで 120s ハングした事象の切り分け用）。診断完了後に削除する。
# 仮説: rootless + netavark/aardvark-dns/pasta の組み合わせでの custom network 起動不全。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: uv をセットアップ（Python 3.11）
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: podman を導入
        timeout-minutes: 8
        run: |
          set -x
          # azure ミラー不調（本日 2 回、install が 15 分ハング）対策:
          # 標準ミラーへ切替 + 取得リトライ/タイムアウト。
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' \
            /etc/apt/sources.list.d/ubuntu.sources
          apt_get() {
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 "$@"
          }
          for _ in 1 2 3; do
            if apt_get update; then break; fi
            sleep 5
          done
          apt_get install -y podman
          podman --version
      - name: バージョンと環境
        run: |
          set -x
          podman version || true
          podman info --format '{{.Host.NetworkBackend}} {{.Host.NetworkBackendInfo.Version}}' || true
          which slirp4netns pasta aardvark-dns netavark || true
          slirp4netns --version 2>/dev/null || true
          pasta --version 2>/dev/null || true
      - name: イメージ pull
        run: podman pull docker.io/library/python:3.12-slim
      - name: A) 既定ネットワークで run
        run: |
          set -x
          rc=0; timeout 45 podman run -d --name ta docker.io/library/python:3.12-slim sleep infinity || rc=$?
          echo "A rc=$rc"
          podman rm -f ta || true
      - name: B) 通常 custom bridge で run
        run: |
          set -x
          podman network create net-b
          rc=0; timeout 45 podman run -d --name tb --network net-b docker.io/library/python:3.12-slim sleep infinity || rc=$?
          echo "B rc=$rc"
          podman rm -f tb || true
          podman network rm net-b || true
        continue-on-error: true
      - name: C) internal で run（事象の再現想定）
        run: |
          set -x
          podman network create --internal net-c
          rc=0; timeout 45 podman run -d --name tc --network net-c docker.io/library/python:3.12-slim sleep infinity || rc=$?
          echo "C rc=$rc"
          podman rm -f tc || true
          podman network rm net-c || true
        continue-on-error: true
      - name: D) internal + DNS 無効で run
        run: |
          set -x
          podman network create --internal --disable-dns net-d
          rc=0; timeout 45 podman run -d --name td --network net-d docker.io/library/python:3.12-slim sleep infinity || rc=$?
          echo "D rc=$rc"
          podman rm -f td || true
          podman network rm net-d || true
        continue-on-error: true
      - name: E) internal のデバッグログ（どこで止まるか）
        run: |
          set -x
          podman network create --internal net-e
          rc=0; timeout 60 podman --log-level=debug run -d --name te --network net-e docker.io/library/python:3.12-slim sleep infinity 2>&1 | tail -60 || rc=$?
          echo "E rc=$rc"
          podman rm -f te || true
          podman network rm net-e || true
        continue-on-error: true
      - name: F) Python subprocess（capture_output）× internal+DNS——パイプ EOF 待ちハング仮説の再現
        run: |
          set -x
          podman network create --internal net-f
          rc=0; python3 - <<'EOF' || rc=$?
          import subprocess
          try:
              p = subprocess.run(
                  ["podman", "run", "-d", "--name", "tf", "--network", "net-f",
                   "--", "docker.io/library/python:3.12-slim", "sleep", "infinity"],
                  capture_output=True, timeout=45)
              print("F completed rc=", p.returncode, "stdout=", p.stdout[:80])
          except subprocess.TimeoutExpired:
              print("F TIMEOUT (pipe EOF 待ちハングを再現)")
              raise SystemExit(124)
          EOF
          echo "F rc=$rc"
          pgrep -a -f "aardvark" || echo "no aardvark"
          podman rm -f tf || true
          podman network rm net-f || true
        continue-on-error: true
      - name: G) Python subprocess（capture_output）× internal+--disable-dns——修正候補の検証
        run: |
          set -x
          podman network create --internal --disable-dns net-g
          rc=0; python3 - <<'EOF' || rc=$?
          import subprocess
          try:
              p = subprocess.run(
                  ["podman", "run", "-d", "--name", "tg", "--network", "net-g",
                   "--", "docker.io/library/python:3.12-slim", "sleep", "infinity"],
                  capture_output=True, timeout=45)
              print("G completed rc=", p.returncode, "stdout=", p.stdout[:80])
          except subprocess.TimeoutExpired:
              print("G TIMEOUT")
              raise SystemExit(124)
          EOF
          echo "G rc=$rc"
          pgrep -a -f "aardvark" || echo "no aardvark"
          podman rm -f tg || true
          podman network rm net-g || true
        continue-on-error: true
      - name: H) 同一 Python プロセスから network create + run（ドライバ経路の忠実再現）
        run: |
          set -x
          rc=0; python3 - <<'EOF' || rc=$?
          import subprocess
          def run(argv, timeout=45):
              print("RUN", argv, flush=True)
              p = subprocess.run(argv, capture_output=True, timeout=timeout)
              print("rc=", p.returncode, "out=", p.stdout[:60], "err=", p.stderr[:120], flush=True)
              return p
          run(["podman", "network", "create", "--internal", "cube-debugh"])
          try:
              run(["podman", "run", "-d", "--name", "cube-sb-debugh", "--network", "cube-debugh",
                   "--", "docker.io/library/python:3.12-slim", "sleep", "infinity"])
          except subprocess.TimeoutExpired:
              print("H TIMEOUT", flush=True)
              raise SystemExit(124)
          EOF
          echo "H rc=$rc"
          podman rm -f cube-sb-debugh || true
          podman network rm cube-debugh || true
        continue-on-error: true
      - name: I) pytest 単独ファイル実行での再現確認（スイート汚染の切り分け）
        env:
          SUBACO_SHIM_LIVE_TEMPLATE: docker.io/library/python:3.12-slim
        run: |
          set -x
          rc=0
          timeout 240 uv run --with pytest pytest \
            tests/test_live_podman_isolation.py::test_egress_blocked_by_default -q -rs || rc=$?
          echo "I rc=$rc"
        continue-on-error: true
      - name: J) uv の Python 単体（pytest 抜き）で network create + run
        run: |
          set -x
          rc=0; uv run python - <<'EOF' || rc=$?
          import subprocess
          subprocess.run(["podman", "network", "create", "--internal", "cube-debugj"],
                         capture_output=True, timeout=45, check=True)
          try:
              p = subprocess.run(["podman", "run", "-d", "--name", "cube-sb-debugj",
                                  "--network", "cube-debugj",
                                  "--", "docker.io/library/python:3.12-slim", "sleep", "infinity"],
                                 capture_output=True, timeout=45, check=True)
              print("J completed", p.stdout[:60], flush=True)
          except subprocess.TimeoutExpired:
              print("J TIMEOUT", flush=True)
              raise SystemExit(124)
          EOF
          echo "J rc=$rc"
          podman rm -f cube-sb-debugj || true
          podman network rm cube-debugj || true
        continue-on-error: true
      - name: K) pytest -s（capture 無効）で単独テスト実行
        env:
          SUBACO_SHIM_LIVE_TEMPLATE: docker.io/library/python:3.12-slim
        run: |
          set -x
          rc=0
          timeout 240 uv run --with pytest pytest \
            tests/test_live_podman_isolation.py::test_egress_blocked_by_default -q -rs -s || rc=$?
          echo "K rc=$rc"
        continue-on-error: true
      - name: M) pytest × driver 抜き（subprocess 直呼びのミニテスト）
        run: |
          set -x
          cat > /tmp/test_probe.py <<'EOF'
          import subprocess
          def test_probe():
              subprocess.run(["podman", "network", "create", "--internal", "cube-debugm"],
                             capture_output=True, timeout=45, check=True)
              p = subprocess.run(["podman", "run", "-d", "--name", "cube-sb-debugm",
                                  "--network", "cube-debugm",
                                  "--", "docker.io/library/python:3.12-slim", "sleep", "infinity"],
                                 capture_output=True, timeout=45, check=True)
              assert p.stdout
          EOF
          rc=0
          timeout 240 uv run --with pytest pytest /tmp/test_probe.py -q || rc=$?
          echo "M rc=$rc"
          podman rm -f cube-sb-debugm || true
          podman network rm cube-debugm || true
        continue-on-error: true
      - name: 残プロセスと状態
        if: always()
        run: |
          set -x
          pgrep -a -f "aardvark|netavark|slirp|pasta|conmon" || true
          podman ps -a || true
          podman network ls || true
